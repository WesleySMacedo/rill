name: Rill Agent build

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    env:
      # Private beta: unsigned builds. No signing secrets are used.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: rill-agent-windows
          path: |
            agent/release/Rill-Agent-Setup.exe
            agent/release/Rill-Agent-Portable.exe
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rill Agent ${{ github.ref_name }} (beta, unsigned)
          files: |
            agent/release/Rill-Agent-Setup.exe
            agent/release/Rill-Agent-Portable.exe
